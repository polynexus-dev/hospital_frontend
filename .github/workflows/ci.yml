name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Dependency vulnerability scan (npm audit)
        # Same non-blocking posture as the backend's pip-audit step — a new
        # CVE in an existing pinned dependency surfaces in the run summary
        # for a human to triage, rather than failing unrelated PRs.
        run: npm audit --audit-level=high
        continue-on-error: true
