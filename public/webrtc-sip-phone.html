<!DOCTYPE html>
<!--
  ┌─────────────────────────────────────────────────────────────┐
  │  WebRTC SIP Softphone — replaces Zoiper entirely            │
  │  Registers extension 101 with HoduPBX via WebSocket.        │
  │  Enhanced with ErrorController & Security Guardrails        │
  └─────────────────────────────────────────────────────────────┘

  HOW TO USE:
  1. Open in Chrome/Edge (WebRTC required)
  2. Click "Register" — browser registers as extension 101
  3. Run click-to-call from your app — browser rings instead of Zoiper
  4. Click "Answer" to bridge the call to the patient
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebRTC SIP Phone — Extension 101</title>
  <script src="jssip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 0;
    }
    .phone {
      background: #1e293b; border-radius: 16px; padding: 28px;
      width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 { font-size: 16px; color: #94a3b8; margin-bottom: 20px; text-align: center; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #0f172a; padding: 6px 14px; border-radius: 20px;
      font-size: 13px; margin-bottom: 14px; width: 100%; justify-content: center;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.offline  { background: #64748b; }
    .dot.online   { background: #22c55e; animation: pulse 2s infinite; }
    .dot.ringing  { background: #f59e0b; animation: pulse 0.5s infinite; }
    .dot.incall   { background: #3b82f6; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Error & Security Alert Banner */
    .error-banner {
      display: flex; align-items: flex-start; gap: 8px;
      background: #450a0a; border: 1px solid #dc2626; color: #fecaca;
      border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-bottom: 14px;
      line-height: 1.4; animation: fadeIn 0.2s ease-in-out;
    }
    .error-banner.warn {
      background: #451a03; border-color: #f59e0b; color: #fef3c7;
    }
    .error-banner.info {
      background: #082f49; border-color: #0284c7; color: #bae6fd;
    }
    .error-banner.success {
      background: #064e3b; border-color: #10b981; color: #a7f3d0;
    }
    .dismiss-btn {
      background: none; border: none; color: inherit; font-size: 14px;
      cursor: pointer; padding: 0 4px; opacity: 0.8; line-height: 1;
    }
    .dismiss-btn:hover { opacity: 1; }

    .config { background: #0f172a; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
    .config label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; }
    .config input {
      width: 100%; background: #1e293b; border: 1px solid #334155;
      border-radius: 6px; padding: 7px 10px; color: #e2e8f0; font-size: 13px;
      margin-bottom: 10px;
    }
    .config input:focus { outline: none; border-color: #3b82f6; }
    .btn {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-register   { background: #3b82f6; color: #fff; }
    .btn-autotry    { background: #8b5cf6; color: #fff; }
    .btn-answer     { background: #22c55e; color: #fff; }
    .btn-hangup     { background: #ef4444; color: #fff; }
    .btn-unregister { background: #475569; color: #fff; }
    .btn-c2c        { background: #10b981; color: #fff; }
    .btn:not(:disabled):hover { filter: brightness(1.1); transform: translateY(-1px); }
    .log {
      background: #0f172a; border-radius: 8px; padding: 10px;
      font-size: 11px; font-family: monospace; color: #64748b;
      height: 170px; overflow-y: auto; margin-top: 12px;
    }
    .entry.info    { color: #94a3b8; }
    .entry.success { color: #22c55e; }
    .entry.warn    { color: #f59e0b; }
    .entry.error   { color: #ef4444; }
    audio { display: none; }
  </style>
</head>
<body>
<div class="phone">
  <h1>📥 WebRTC Incoming Call Receiver</h1>
  <div style="text-align:center;font-size:11px;color:#64748b;margin-top:-14px;margin-bottom:14px;">Extension 101 · Dedicated to Receive Calls</div>

  <div class="status-badge">
    <span class="dot offline" id="statusDot"></span>
    <span id="statusText">Listening for Incoming Calls: Offline</span>
  </div>

  <!-- Error & Security Alert Banner -->
  <div id="errorBanner" class="error-banner" style="display:none;">
    <span id="errorBannerIcon">⚠️</span>
    <span id="errorBannerText" style="flex:1;"></span>
    <button class="dismiss-btn" id="btnDismissError" title="Dismiss">✕</button>
  </div>

  <div class="config">
    <label>HoduPBX WebSocket URL</label>
    <input id="wsUrl" value="wss://ecallpbx.konnectcom.in:7443"/>
    <label>SIP Domain</label>
    <input id="sipDomain" value="ecallpbx.konnectcom.in"/>
    <label>SIP Username <span style="color:#f59e0b;font-size:10px">(from HoduPBX: tenantID+ext)</span></label>
    <input id="extNumber" value="1048101"/>
    <label>Extension Password</label>
    <input id="extPassword" placeholder="Enter Extension Password" type="password" autocomplete="off"/>
    <div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:#94a3b8;">
      <input type="checkbox" id="chkAutoAnswer" style="accent-color:#22c55e;cursor:pointer;"/>
      <label for="chkAutoAnswer" style="margin:0;cursor:pointer;">⚡ Auto-Answer Incoming Calls (Optional)</label>
    </div>
  </div>

  <button class="btn" style="background:#0284c7;color:#fff;margin-bottom:8px" id="btnMic">🎙️ Enable Microphone Access</button>
  <button class="btn btn-register"   id="btnRegister" >📡 Register Extension</button>
  <button class="btn btn-autotry"    id="btnAutoTry"  >🔍 Auto-Detect Working Configuration</button>
  <button class="btn btn-answer"     id="btnAnswer"       disabled>📞 Answer Incoming Call</button>
  <button class="btn btn-hangup"     id="btnHangup"       disabled>🔴 Hang Up</button>
  <button class="btn btn-unregister" id="btnUnreg"     disabled>❌ Unregister</button>

  <audio id="remoteAudio" autoplay></audio>
  <div class="log" id="log"></div>
</div>
<script src="webrtc-sip-phone.js"></script>
</body>
</html>
